name: Release

# Push a version tag (e.g. `npm version patch && git push --follow-tags`) to publish to npm
# and create a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # add required reviewers on this environment to approve each publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          node scripts/sync-version.mjs --check
      - run: npm ci
      - run: npm test
      - name: Publish to npm
        # Authenticates with npm trusted publishing (OIDC); no token is stored anywhere.
        # Skips a version that is already on npm, e.g. the first release published by hand.
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "x-api-mcp@${version}" version >/dev/null 2>&1; then
            echo "x-api-mcp@${version} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
